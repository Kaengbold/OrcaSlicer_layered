# Fork-only test build: macOS Universal (arm64 + x86_64) alone, for trying the
# layer refinement branch on a Mac. Remove this file before opening a pull
# request against OrcaSlicer/OrcaSlicer.
name: Build macOS (test)

on:
  push:
    branches:
      - layer-refinement
    paths:
      - 'deps/**'
      - 'deps_src/**'
      - 'cmake/**'
      - 'src/**'
      - '**/CMakeLists.txt'
      - 'resources/**'
      - 'localization/**'
      - 'tests/**'
      - '.github/workflows/build_macos_test.yml'
  workflow_dispatch:

concurrency:
  # A newer push replaces a build that is still running.
  group: build-macos-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_macos_arch:
    name: Build macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    permissions:
      actions: write
      contents: write
    # Same inputs as build_all.yml, so both share the deps cache.
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: macos-15
      arch: ${{ matrix.arch }}
    secrets: inherit

  build_macos_universal:
    name: Build macOS Universal
    needs: build_macos_arch
    if: ${{ !cancelled() && needs.build_macos_arch.result == 'success' }}
    permissions:
      actions: write
      contents: write
    uses: ./.github/workflows/build_orca.yml
    with:
      os: macos-15
      arch: universal
      macos-combine-only: true
    secrets: inherit

  unit_tests_macos_arm64:
    name: macOS arm64 tests
    needs: build_macos_arch
    if: ${{ !cancelled() && needs.build_macos_arch.result == 'success' }}
    uses: ./.github/workflows/unit_tests.yml
    with:
      os: macos-15
      artifact: ${{ github.sha }}-tests-macos-arm64
      test-dir: build/arm64/tests
